<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Gymly · Train smarter. Get stronger.</title>
    <!-- Icons are rendered from assets/brand/gymly-mark.svg; favicon.ico comes from app.json web.favicon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="description" content="Gymly is a focused workout tracker. Log sets, reps and weights, follow multi-week programs, and see your progress over time." />
    <!-- Social previews (crawlers don't run JS, so these live in the static shell). og.png is 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gymly" />
    <meta property="og:title" content="Gymly · Train smarter. Get stronger." />
    <meta property="og:description" content="Your workouts. Your progress. Your journey. All in one place." />
    <meta property="og:url" content="https://gymly-omega.vercel.app/" />
    <meta property="og:image" content="https://gymly-omega.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gymly logo with the headline Train smarter. Get stronger." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
