<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Gymly · Train smarter. Get stronger.</title>
    <!-- Icons are rendered from assets/brand/gymly-mark.svg; favicon.ico comes from app.json web.favicon. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="application-name" content="Gymly" />
    <meta name="apple-mobile-web-app-title" content="Gymly" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Your personal workout companion. Track workouts, follow structured training programs, and visualize your fitness progress." />
    <!-- Link previews. Every route gets these generic, non-personal tags in the static shell (crawlers and
         Messages don't run JS); scripts/seo.js fills %SITE_URL% at build time and writes per-page copies for
         public pages. og:title stays brand-free (og:site_name carries the brand), per Apple TN3156. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gymly" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Train smarter. Get stronger." />
    <meta property="og:description" content="Your personal workout companion. Track workouts, follow structured training programs, and visualize your fitness progress." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Gymly logo: a lime dumbbell tile beside the Gymly wordmark." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Train smarter. Get stronger." />
    <meta name="twitter:description" content="Your personal workout companion. Track workouts, follow structured training programs, and visualize your fitness progress." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="The Gymly logo: a lime dumbbell tile beside the Gymly wordmark." />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
